<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SHELDON715.SYS boot sequence</title>
  <desc id="desc">A blue terminal window over a striped dark system panel for Sheldon Liu.</desc>
  <defs>
    <pattern id="diagonal" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(32)">
      <rect width="12" height="12" fill="#111820"/>
      <rect width="3" height="12" fill="#182431"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" fill="#0B0F14"/>
  <rect x="24" y="24" width="1152" height="312" fill="url(#diagonal)" stroke="#253445" stroke-width="2"/>
  <text x="655" y="223" fill="#58A6FF" stroke="#0B0F14" stroke-width="2" paint-order="stroke" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-style="italic" letter-spacing="1">Sheldon</text>
  <text x="657" y="258" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="4">AI-ENABLED FULL-STACK ENGINEERING</text>

  <g transform="translate(108 68)">
    <rect width="538" height="238" fill="#0B0F14" stroke="#58A6FF" stroke-width="2"/>
    <rect width="538" height="32" fill="#58A6FF"/>
    <rect x="0" y="32" width="538" height="1" fill="#58A6FF"/>
    <circle cx="16" cy="16" r="5" fill="#0B0F14"/>
    <circle cx="34" cy="16" r="5" fill="#0B0F14"/>
    <circle cx="52" cy="16" r="5" fill="#0B0F14"/>
    <text x="70" y="21" fill="#0B0F14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="1">SHELDON715.SYS</text>
    <text x="20" y="64" fill="#58A6FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">&gt; INIT SHELDON715.SYS ............ [ OK ]</text>
    <text x="20" y="91" fill="#58A6FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">&gt; MOUNT /ai /systems /mobile ..... [ OK ]</text>
    <text x="20" y="118" fill="#58A6FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">&gt; LOAD PRODUCT_PATH .............. [ OK ]</text>
    <rect x="0" y="130" width="538" height="24" fill="#172536"/>
    <text x="20" y="147" fill="#79C0FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">&gt; DECRYPT PERSONAL_DATA ........ [ MIN ]</text>
    <text x="20" y="181" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">&gt; STATUS: BUILD. SHIP. REPEAT.</text>
    <text x="20" y="211" fill="#58A6FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">&gt; <tspan filter="url(#softGlow)">_</tspan></text>
    <rect x="0" y="219" width="538" height="19" fill="#58A6FF"/>
    <text x="16" y="233" fill="#0B0F14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">OBJ: 4 BUILDS                 MEM: OK                 LOCAL: MELBOURNE</text>
  </g>
</svg>
